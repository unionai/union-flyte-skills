name: publish

# Publishes union-flyte-skills to PyPI from plugins/union (the single source of
# truth) with trusted publishing: no API token is stored anywhere.
#
# Release: `python packaging/set_version.py X.Y.Z`, land it through a PR, then
# push tag vX.Y.Z. The build job refuses to continue unless the tag matches the
# plugin manifest. See RELEASING.md.
#
# One-time setup (RELEASING.md, "First-time setup"):
#   - a GitHub environment named `pypi`
#   - a PyPI trusted publisher (a pending one before the first release) for
#     project `union-flyte-skills`, pointing at this workflow and that environment
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine

      - id: version
        name: Read the version from the plugin manifest
        run: |
          VERSION=$(python packaging/build.py --print-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION"

      # A tag that disagrees with the manifest would publish a version nobody
      # can trace back to a commit, so fail loudly instead.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $VERSION. Run packaging/set_version.py $TAG and re-tag."
            exit 1
          fi

      - name: Verify the distribution builds and installs
        run: python packaging/verify.py

      - name: Build the release artifacts
        run: |
          set -euo pipefail
          python packaging/build.py --outdir build
          (cd build/pypi/union-flyte-skills && python -m build)
          mkdir -p dist
          cp build/pypi/union-flyte-skills/dist/* dist/
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist

  pypi:
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release tag should be a no-op, not a hard failure.
          skip-existing: true

  release:
    needs: [pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - name: Attach the published artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" dist/* \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
